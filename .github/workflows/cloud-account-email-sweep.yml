name: Cloud account email sweep

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-account-email-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SWEEP_SECRET: ${{ secrets.CLOUD_ACCOUNT_EMAIL_SWEEP_SECRET }}
      SWEEP_URL: ${{ secrets.CLOUD_ACCOUNT_EMAIL_SWEEP_URL }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$SWEEP_URL"
          test -n "$SWEEP_SECRET"
          case "$SWEEP_URL" in
            https://*/api/internal/cloud-account-email/sweep) ;;
            *) echo "CLOUD_ACCOUNT_EMAIL_SWEEP_URL is invalid." >&2; exit 1 ;;
          esac
      - name: Deliver queued account emails
        shell: bash
        run: |
          curl \
            --fail-with-body \
            --location \
            --max-redirs 0 \
            --max-time 240 \
            --request POST \
            --header "Authorization: Bearer $SWEEP_SECRET" \
            --header "Content-Type: application/json" \
            --url "$SWEEP_URL"
